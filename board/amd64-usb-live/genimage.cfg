image efi-part.vfat {
 vfat {
  extraargs = "-F 32"
  file EFI { image = "efi-part/EFI" }
  file bzImage { image = "bzImage" }
  file boot-initramfs.cpio.gz { image = "boot-initramfs.cpio.gz" }
 }
 size = 256M
}
image usb-live.img {
 hdimage { partition-table-type = "gpt" }
 partition boot {
  partition-type-uuid = U
  partition-uuid = @BOOT_UUID@
  offset = 1M
  image = "efi-part.vfat"
 }
 partition system {
  partition-type-uuid = L
  partition-uuid = @ROOT_UUID@
  image = "rootfs.squashfs"
 }
}
