set default=0
set timeout=5
menuentry "AMD64 live desktop" {
 linux /bzImage live.root=@ROOT_UUID@ systemd.gpt_auto=0 rd.systemd.gpt_auto=0
 initrd /boot-initramfs.cpio.gz
}
menuentry "AMD64 live desktop (Pixman recovery)" {
 linux /bzImage live.root=@ROOT_UUID@ live.renderer=pixman systemd.gpt_auto=0 rd.systemd.gpt_auto=0
 initrd /boot-initramfs.cpio.gz
}
